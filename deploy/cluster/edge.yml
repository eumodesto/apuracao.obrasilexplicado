# Cluster, entry machine: HTTPS (Caddy), Postgres and Redis. The app runs on the worker machines
# (worker.yml), reached through the DigitalOcean private network. See docs/DEPLOY_DIGITALOCEAN.md.
#   docker compose -p apuracao -f deploy/cluster/edge.yml --env-file .env.production up -d
# Same project name and volumes as docker-compose.yml, so the database and certificates carry over.

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
      # Worker processes, "ip:port" separated by spaces.
      UPSTREAMS: ${UPSTREAMS:?set UPSTREAMS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    image: postgres:17-alpine
    # See docker-compose.yml. Every app process opens its own small pools, hence more connections.
    command: [postgres, -c, synchronous_commit=off, -c, shared_buffers=1GB, -c, max_connections=500]
    restart: unless-stopped
    environment:
      POSTGRES_USER: apuracao
      POSTGRES_DB: apuracao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Only on the private network address, never on the public one.
    ports:
      - '${PRIVATE_IP:?set PRIVATE_IP}:5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apuracao -d apuracao']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        redis-server,
        --save,
        '',
        --appendonly,
        'no',
        --requirepass,
        '${REDIS_PASSWORD:?set REDIS_PASSWORD}',
      ]
    ports:
      - '${PRIVATE_IP}:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  pg-data:
  caddy-data:
  caddy-config:
