# Production on a DigitalOcean Droplet: see docs/DEPLOY_DIGITALOCEAN.md.
#   docker compose --env-file .env.production up -d --build
# Variables come from .env.production (copy deploy/env.production.example); --env-file also
# feeds the ${...} substitutions below (DOMAIN, POSTGRES_PASSWORD, DATABASE_URL).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      # Compose-internal Postgres unless .env.production points to a Managed Database.
      DATABASE_URL: ${DATABASE_URL:-postgres://apuracao:${POSTGRES_PASSWORD}@db:5432/apuracao}
    volumes:
      - tse-cache:/app/.cache
      - app-data:/app/.data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apuracao
      POSTGRES_DB: apuracao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apuracao -d apuracao']
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  tse-cache:
  app-data:
  pg-data:
  caddy-data:
  caddy-config:
